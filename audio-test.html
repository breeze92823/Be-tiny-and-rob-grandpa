<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Audio Test Bench</title>
    <style>
      :root {
        --bg: #f4f1ea;
        --panel: #ffffff;
        --ink: #23201b;
        --muted: #6d665b;
        --line: #ddd6c8;
        --accent: #c9671e;
        --accent-ink: #ffffff;
        --on: #2f8a4c;
        --warn: #b3362d;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1b1916;
          --panel: #26231f;
          --ink: #efe9df;
          --muted: #a59d90;
          --line: #3a352f;
          --accent: #e0853a;
          --accent-ink: #1b1916;
          --on: #55b974;
          --warn: #e06358;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      body { padding: 12px max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left)); }
      h1 { font-size: 20px; margin: 4px 0 2px; }
      h2 { font-size: 15px; margin: 0 0 8px; }
      .sub { color: var(--muted); margin: 0 0 12px; }
      .bar { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 8px 0; border-bottom: 1px solid var(--line); margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
      .stat { font-variant-numeric: tabular-nums; color: var(--muted); }
      .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); }
      section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
      .row { display: flex; align-items: center; gap: 6px; padding: 3px 0; flex-wrap: wrap; }
      .row .name { flex: 1 1 110px; min-width: 0; font-family: ui-monospace, Consolas, monospace; font-size: 13px; overflow-wrap: anywhere; }
      button { font: inherit; min-height: 34px; min-width: 40px; padding: 4px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; touch-action: manipulation; }
      button:hover { border-color: var(--accent); }
      button:active { transform: translateY(1px); }
      button.main { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
      button.on { background: var(--on); color: #fff; border-color: var(--on); }
      label { display: inline-flex; align-items: center; gap: 6px; }
      input[type='range'] { width: 120px; }
      select { font: inherit; min-height: 34px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
      .controls { display: flex; flex-wrap: wrap; gap: 8px 16px; }
      table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 13px; }
      th, td { text-align: left; padding: 2px 6px; border-bottom: 1px solid var(--line); }
      td.bad { color: var(--warn); font-weight: 600; }
      .meter { width: 140px; height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; display: inline-block; vertical-align: middle; }
      .meter > i { display: block; height: 100%; width: 0; background: var(--on); }
    </style>
  </head>
  <body>
    <h1>Audio Test Bench</h1>
    <p class="sub">Every sound effect, loop, music mood and stinger. Any click starts the audio. 3D buttons place the sound left, right or 18 m ahead of a listener at the origin facing -Z.</p>
    <div id="app"></div>
    <script type="module" src="./src/game/audioTest.js"></script>
  </body>
</html>
